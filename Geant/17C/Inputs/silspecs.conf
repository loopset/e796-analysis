% This specs.conf includes the SPACER in ACTAR's front flange 
% Using S2384 config for 17C experiment

% All here in mm
[f0]
Width: 50.
Height: 50.
Thickness: 1.5
%% iX command explanation
%% iX = index : <x OR y centre point, z point> respect to pad plane
i0: 203, 125
i1: 153, 125
i2: 103, 125
i3: 53, 125

i4: 228, 175
i5: 178, 175
i6: 78, 175
i7: 28, 175

i8: 203, 225
i9: 153, 225
i10: 103, 225
i11: 53, 225
%% Point is referred to origin of pad plane
%% this layer is along X
Point: 307.5, 128, 135
Normal: 1, 0, 0
%% One can set a commom threshold in MeV units
CommomThresh: 0.5
%% Or specify one per pad with t command
%% t0: 0.8
%% t1: 0.5
%% Spec of side
Side: front
% Pad in painter
PadIdx: 5
Particle: Both
Mults: 1
MatchMargin: 2.5

